name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  MACOSX_DEPLOYMENT_TARGET: "10.12"

jobs:
  build-macos:
    runs-on: "macos-latest"

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: "Install Rust (ARM)"
        shell: bash
        run: "rustup target add aarch64-apple-darwin"

      - name: "Install Rust (Intel)"
        shell: bash
        run: "rustup target add x86_64-apple-darwin"

      - name: "Setup sccache"
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"

      - name: "Vendor dependencies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"

      - name: "Install System Deps"
        shell: bash
        run: "env CI=yes PATH=$PATH ./get-deps"

      - name: "Build wezterm (Release mode Intel)"
        shell: bash
        run: "cargo build --target x86_64-apple-darwin -p wezterm --release"

      - name: "Build wezterm (Release mode ARM)"
        shell: bash
        run: "cargo build --target aarch64-apple-darwin -p wezterm --release"

      - name: "Build wezterm-gui (Release mode Intel)"
        shell: bash
        run: "cargo build --target x86_64-apple-darwin -p wezterm-gui --release"

      - name: "Build wezterm-gui (Release mode ARM)"
        shell: bash
        run: "cargo build --target aarch64-apple-darwin -p wezterm-gui --release"

      - name: "Build wezterm-mux-server (Release mode Intel)"
        shell: bash
        run: "cargo build --target x86_64-apple-darwin -p wezterm-mux-server --release"

      - name: "Build wezterm-mux-server (Release mode ARM)"
        shell: bash
        run: "cargo build --target aarch64-apple-darwin -p wezterm-mux-server --release"

      - name: "Build strip-ansi-escapes (Release mode Intel)"
        shell: bash
        run: "cargo build --target x86_64-apple-darwin -p strip-ansi-escapes --release"

      - name: "Build strip-ansi-escapes (Release mode ARM)"
        shell: bash
        run: "cargo build --target aarch64-apple-darwin -p strip-ansi-escapes --release"

      - name: "Install cargo-nextest"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cargo-nextest"
          cache-key: "macos"

      - name: "Run tests"
        shell: bash
        run: "cargo nextest run --all --no-fail-fast --target=x86_64-apple-darwin"

      - name: "Package and sign"
        env:
          MACOS_APPLEID: ${{ secrets.MACOS_APPLEID }}
          MACOS_APP_PW: ${{ secrets.MACOS_APP_PW }}
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PW: ${{ secrets.MACOS_CERT_PW }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        shell: bash
        run: "bash ci/deploy.sh"

      - name: "Rename artifacts for Claude Terminal"
        shell: bash
        run: |
          for f in WezTerm-*.zip; do
            newname=$(echo "$f" | sed 's/WezTerm/ClaudeTerminal/g')
            mv "$f" "$newname"
          done

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "macos"
          path: "ClaudeTerminal-*.zip"

  create-release:
    runs-on: ubuntu-latest
    needs: build-macos
    permissions:
      contents: write

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4

      - name: "Download macOS artifact"
        uses: actions/download-artifact@v4
        with:
          name: "macos"

      - name: "Generate checksums"
        shell: bash
        run: |
          for f in ClaudeTerminal-*.zip; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: "Get tag name"
        id: tag
        shell: bash
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.TAG }}
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "Claude Terminal ${{ steps.tag.outputs.TAG }}"
          body: |
            ## Claude Terminal Release

            A specialized terminal emulator optimized for running multiple Claude Code instances.

            ### Installation

            **macOS (Universal Binary - Intel + Apple Silicon)**
            ```bash
            # Download and extract
            unzip ClaudeTerminal-macos-*.zip

            # Move to Applications
            mv ClaudeTerminal-*/ClaudeTerminal.app /Applications/
            ```

            ### Changes
            See CHANGELOG.md for details.
          files: |
            ClaudeTerminal-*.zip
            *.sha256
          draft: false
          prerelease: false

  update-homebrew:
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4

      - name: "Download macOS artifact"
        uses: actions/download-artifact@v4
        with:
          name: "macos"

      - name: "Get tag name"
        id: tag
        shell: bash
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: "Calculate SHA256"
        id: sha
        shell: bash
        run: |
          SHA=$(sha256sum ClaudeTerminal-macos-*.zip | cut -d' ' -f1)
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT

      - name: "Generate Homebrew formula"
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.TAG }}
          RELEASE_SHA: ${{ steps.sha.outputs.SHA256 }}
        shell: bash
        run: |
          sed -e "s/@TAG@/$RELEASE_TAG/g" -e "s/@SHA256@/$RELEASE_SHA/g" \
            < ci/claude-terminal-homebrew-macos.rb.template \
            > claude-terminal.rb

      - name: "Upload Homebrew formula"
        uses: actions/upload-artifact@v4
        with:
          name: "homebrew-formula"
          path: "claude-terminal.rb"
